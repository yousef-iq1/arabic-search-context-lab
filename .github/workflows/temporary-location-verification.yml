name: Temporary SerpApi location verification
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check official SerpApi Locations API
        shell: bash
        run: |
          set -euo pipefail
          for city in Baghdad Riyadh Cairo Casablanca; do
            echo "=== $city ==="
            curl -L -sS --fail --retry 3 --retry-all-errors --max-time 120 "https://serpapi.com/locations.json?q=$city&limit=20" > "/tmp/$city.json"
            python - "$city" "/tmp/$city.json" <<'PY'
          import json, sys
          city, path = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          if isinstance(data, dict):
              rows = data.get("locations", data.get("results", []))
          else:
              rows = data
          print("COUNT", len(rows))
          for row in rows[:20]:
              if isinstance(row, dict):
                  print(json.dumps({
                      "canonical_name": row.get("canonical_name"),
                      "name": row.get("name"),
                      "country_code": row.get("country_code"),
                      "target_type": row.get("target_type"),
                  }, ensure_ascii=False))
          PY
          done
